<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Travel Guide</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
       
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>

        <div id="homePage">
            <h1>Istanbul</h1>
            <p>Entdecke deine Lieblingsorte</p>


    
            <div class="neighborhood-container" >

                <div class="neighborhood" data-name="Fatih"> <!-- data-name-Attribut für die Identifizierung des Stadtviertels für js-->
                    <h3>Fatih</h3>
                </div>
                
                <div class="neighborhood" data-name="Beşiktaş">
                    <h3>Beşiktaş</h3>
                </div>

                <div class="neighborhood" data-name="Üsküdar">
                    <h3>Üsküdar</h3>
                </div>

                <div class="neighborhood" data-name="Ümraniye">
                    <h3>Ümraniye</h3>
                </div>
             
                <div class="neighborhood" data-name="Kadiköy">
                    <h3>Kadiköy</h3>
                </div>

                <div class="neighborhood" data-name="Karaköy">
                    <h3>Karaköy</h3>
                </div>

                <div class="neighborhood" data-name="Sirkeci">
                    <h3>Sirkeci</h3>
                </div>

                <div class="neighborhood" data-name="Galataport">
                    <h3>Galataport</h3>
                </div>


            </div>
        </div>

        <div id="neighborhoodDetails">

            <button id="backButton">Zurück</button>

            <h3 id="neighborhoodTitle"></h3>
           

            <div class="categories">
                <button id="cafeButton">Cafes ☕</button>
                <button id="attractionButton">Sehenswürdigkeiten 🏛</button>
                <button id="activityButton">Aktivitäten ✨</button>
            </div>

        </div>

        <div id="cafeDetails">

            <button id="backButtonCafe">Zurück</button>

            <h2 id="cafeTitle"></h2>
            
            <div id="cafeList"> <!-- Hier werden die Cafes dynamisch eingefügt mit JS -->
            </div>
        </div>


            <script src="script.js"></script>

    </body>
</html>
